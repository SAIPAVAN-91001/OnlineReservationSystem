<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Book Ticket</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="container">

<div class="login-box">

<h1>Book Ticket</h1>

<form action="php/reservation.php" method="POST">

<input type="text"
name="passenger"
placeholder="Passenger Name"
required>

<input type="number"
name="age"
placeholder="Age"
required>

<select name="gender" required>

<option value="">Select Gender</option>

<option>Male</option>

<option>Female</option>

<option>Other</option>

</select>

<input type="text"
name="trainno"
placeholder="Train Number"
required>

<input type="text"
name="trainname"
placeholder="Train Name"
required>

<input type="text"
name="source"
placeholder="Source"
required>

<input type="text"
name="destination"
placeholder="Destination"
required>

<input type="date"
name="journeydate"
required>

<select name="class" required>

<option value="">Travel Class</option>

<option>Sleeper</option>

<option>3A</option>

<option>2A</option>

<option>1A</option>

</select>

<button type="submit">

Book Ticket

</button>

</form>

</div>

</div>

</body>

</html>
